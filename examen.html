<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Papelería Escolar</title>
</head>

<body>

<div class="contenedor">

<h1>Papelería Escolar</h1>
<h3>Calculadora de copias</h3>

<label>Copias a color:</label>
<input type="number" id="color" min="0" value="0">

<label>Copias blanco y negro:</label>
<input type="number" id="bn" min="0" value="0">

<p>
<input type="checkbox" id="credencial" style="width:auto">
Presenta credencial (25% descuento)
</p>

<button onclick="calcular()">Calcular cobro</button>

<div id="resultado"></div>

</div>

<script>

function calcular() {

let color = Number(document.getElementById("color").value);
let bn = Number(document.getElementById("bn").value);
let credencial = document.getElementById("credencial").checked;

if (!Number.isInteger(color) || !Number.isInteger(bn) ||
    color < 0 || bn < 0 || color + bn === 0) {
    alert("Ingresa cantidades válidas de copias.");
    return;
}

let totalCopias = color + bn;
let precioColor, precioBn;

if (totalCopias <= 50) {
    precioColor = 1.50;
    precioBn = 1.00;
}
else if (totalCopias <= 100) {
    precioColor = 1.30;
    precioBn = 0.80;
}
else {
    precioColor = 1.00;
    precioBn = 0.50;
}

let subtotal = (color * precioColor) + (bn * precioBn);

let descuento = 0;

if (credencial) {
    descuento = subtotal * 0.25;
}

let total = subtotal - descuento;

document.getElementById("resultado").innerHTML =

"<h3>Resultado del cobro</h3>" +
"Total de copias: " + totalCopias + "<br>" +
"Subtotal: $" + subtotal.toFixed(2) + "<br>" +
"Descuento: $" + descuento.toFixed(2) + "<br>" +
"<h2>Total a pagar: $" + total.toFixed(2) + "</h2>";

}

</script>

</body>
</html>
